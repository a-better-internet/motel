<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low Desert Engine</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  @page { size: Letter; margin: 0.72in 0.78in 0.82in 0.78in; }
  @page cover { margin: 0; }
  :root{
    --ink:#1f1b17; --ink2:#4d463e; --mute:#7a7066; --rule:#ddd4c6; --paper:#ffffff;
    --tint:#f6f1e8; --tint2:#efe7da; --rust:#b0502a; --teal:#2a7f78; --sand:#d8b98c;
    --night:#16203c; --code:#f4efe6;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ margin:0; font-family:"Source Serif 4", "DejaVu Serif", serif; font-size:10.2pt;
        line-height:1.48; color:var(--ink); background:var(--paper); }
  h1,h2,h3,h4,.osw{ font-family:Oswald, "DejaVu Sans", sans-serif; font-weight:600;
        letter-spacing:0.02em; color:var(--ink); }
  h1{ font-size:30pt; line-height:1.05; margin:0 0 6pt; text-transform:uppercase; letter-spacing:0.03em; }
  h2{ font-size:15pt; margin:20pt 0 6pt; text-transform:uppercase; letter-spacing:0.05em;
      border-bottom:1.2pt solid var(--ink); padding-bottom:2pt; break-after:avoid; }
  h3{ font-size:11.5pt; margin:14pt 0 4pt; text-transform:uppercase; letter-spacing:0.06em;
      color:var(--rust); break-after:avoid; }
  h4{ font-size:10pt; margin:10pt 0 2pt; letter-spacing:0.05em; text-transform:uppercase; break-after:avoid; }
  p{ margin:0 0 7pt; orphans:3; widows:3; }
  ul,ol{ margin:2pt 0 8pt; padding-left:16pt; }
  li{ margin:0 0 3pt; }
  a{ color:var(--teal); text-decoration:none; }
  code{ font-family:"JetBrains Mono", "DejaVu Sans Mono", monospace; font-size:8.3pt;
        background:var(--code); padding:0.5pt 2.5pt; border-radius:2pt; color:#3b2f25; }
  pre{ font-family:"JetBrains Mono", "DejaVu Sans Mono", monospace; font-size:7.4pt; line-height:1.42;
       background:var(--code); border-left:2.4pt solid var(--sand); padding:7pt 9pt; margin:4pt 0 10pt;
       white-space:pre-wrap; break-inside:avoid; color:#2c241d; border-radius:0 3pt 3pt 0; }
  pre code{ background:none; padding:0; font-size:inherit; }
  pre .c{ color:#8a7c6c; font-style:normal; }
  strong{ font-weight:600; }
  em{ font-style:italic; }
  .lede{ font-size:11.6pt; line-height:1.5; color:var(--ink2); margin-bottom:10pt; }
  .chapter{ break-before:page; }
  .kicker{ font-family:Oswald, sans-serif; font-size:10pt; letter-spacing:0.22em; text-transform:uppercase;
           color:var(--rust); margin:0 0 4pt; }
  .opener{ display:grid; grid-template-columns:auto 1fr; gap:14pt; align-items:end; margin:0 0 10pt; }
  .opener .num{ font-family:Oswald, sans-serif; font-weight:700; font-size:64pt; line-height:0.8;
                color:var(--sand); }
  .hero{ width:100%; border-radius:3pt; display:block; margin:6pt 0 4pt; }
  figure{ margin:8pt 0 12pt; break-inside:avoid; }
  figure img{ width:100%; display:block; border-radius:2.5pt; }
  figcaption{ font-family:Oswald, sans-serif; font-weight:400; font-size:8.4pt; letter-spacing:0.03em;
              color:var(--mute); margin-top:4pt; line-height:1.35; }
  figcaption b{ color:var(--ink2); font-weight:600; }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:8pt; }
  .g3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:7pt; }
  .g4{ display:grid; grid-template-columns:repeat(4,1fr); gap:6pt; }
  .g2 figure,.g3 figure,.g4 figure{ margin:0; }
  table{ width:100%; border-collapse:collapse; margin:4pt 0 11pt; font-size:9pt; }
  table.keep{ break-inside:avoid; }
  tr{ break-inside:avoid; }
  th{ font-family:Oswald, sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:0.07em;
      font-size:7.8pt; color:var(--ink2); text-align:left; border-bottom:1pt solid var(--ink);
      padding:3pt 6pt 3pt 0; }
  td{ border-bottom:0.6pt solid var(--rule); padding:3.2pt 6pt 3.2pt 0; vertical-align:top; }
  td code{ font-size:7.9pt; }
  td.n{ font-family:"JetBrains Mono", monospace; font-size:8.2pt; white-space:nowrap; }
  .rule{ background:var(--tint); border-left:3pt solid var(--rust); padding:7pt 10pt 4pt; margin:6pt 0 11pt;
         break-inside:avoid; border-radius:0 3pt 3pt 0; }
  .rule .t{ font-family:Oswald, sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.08em;
            font-size:8.6pt; color:var(--rust); margin-bottom:2pt; }
  .rule p{ margin-bottom:4pt; }
  .note{ background:#eef4f3; border-left:3pt solid var(--teal); padding:7pt 10pt 4pt; margin:6pt 0 11pt;
         break-inside:avoid; border-radius:0 3pt 3pt 0; }
  .note .t{ font-family:Oswald, sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.08em;
            font-size:8.6pt; color:var(--teal); margin-bottom:2pt; }
  .rules{ counter-reset:r; list-style:none; padding:0; margin:4pt 0 10pt; }
  .rules > li{ counter-increment:r; position:relative; padding:0 0 0 26pt; margin:0 0 6pt; break-inside:avoid; }
  .rules > li::before{ content:counter(r, decimal-leading-zero); position:absolute; left:0; top:0.5pt;
                     font-family:Oswald, sans-serif; font-weight:600; color:var(--rust); font-size:10pt; }
  .rules > li b{ font-weight:600; }
  .specs{ display:grid; grid-template-columns:repeat(4,1fr); gap:6pt; margin:6pt 0 12pt; break-inside:avoid; }
  .spec{ background:var(--tint); border-radius:3pt; padding:6pt 8pt 7pt; }
  .spec .k{ font-family:Oswald, sans-serif; font-size:7.4pt; letter-spacing:0.1em; text-transform:uppercase; color:var(--mute); }
  .spec .v{ font-family:Oswald, sans-serif; font-weight:600; font-size:15pt; line-height:1.15; color:var(--ink); }
  .spec .s{ font-size:7.8pt; color:var(--ink2); line-height:1.3; }
  .two{ column-count:2; column-gap:18pt; }
  .two > *{ break-inside:avoid; }
  .swatches{ display:grid; grid-template-columns:repeat(6,1fr); gap:6pt 7pt; margin:6pt 0 10pt; }
  .swatches div{ font-family:Oswald, sans-serif; font-size:7.4pt; letter-spacing:0.05em; color:var(--ink2);
                 text-transform:uppercase; }
  .swatches img{ width:100%; display:block; border-radius:2pt; margin-bottom:2pt; }
  .chips{ display:flex; flex-wrap:wrap; gap:5pt; margin:4pt 0 10pt; }
  .chip{ display:flex; align-items:center; gap:5pt; font-family:"JetBrains Mono", monospace; font-size:7.6pt;
         color:var(--ink2); }
  .chip i{ width:15pt; height:15pt; border-radius:2pt; display:inline-block; border:0.5pt solid rgba(0,0,0,0.15); }
  .skyrow{ display:grid; grid-template-columns:72pt 1fr; gap:8pt; align-items:center; margin:0 0 5pt; }
  .skyrow .lab{ font-family:Oswald, sans-serif; font-size:8.4pt; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink2); }
  .skyrow .bar{ height:30pt; border-radius:2.5pt; }
  .diagram{ break-inside:avoid; margin:8pt 0 12pt; }
  .diagram svg{ width:100%; height:auto; display:block; }
  svg text{ font-family:Oswald, sans-serif; }
  .small{ font-size:8.6pt; color:var(--ink2); }
  .toc{ margin-top:6pt; }
  .toc .row{ display:grid; grid-template-columns:34pt 1fr; gap:6pt; padding:4.5pt 0; border-bottom:0.6pt solid var(--rule); }
  .toc .row .n{ font-family:Oswald, sans-serif; font-weight:700; font-size:20pt; color:var(--sand); line-height:1; }
  .toc .row .h{ font-family:Oswald, sans-serif; font-weight:600; font-size:12pt; text-transform:uppercase; letter-spacing:0.05em; }
  .toc .row .d{ font-size:9pt; color:var(--ink2); }
  .avoid{ break-inside:avoid; }
  .pb{ break-before:page; }
  hr{ border:0; border-top:0.6pt solid var(--rule); margin:12pt 0; }
</style>
</head>
<body>
